
name: Build The Lost World 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check environment
        run: |
          node --version
          npm --version
          java -version

      - name: Check project files
        run: |
          echo "Checking project files..."

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f assets/icon.png

          echo "All project files found!"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Set landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android:screenOrientation=' not in s:
              s = s.replace(
                  "<activity",
                  '<activity android:screenOrientation="landscape"',
                  1
              )

          p.write_text(s)
          print("Landscape orientation enabled!")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Lost-World-2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
