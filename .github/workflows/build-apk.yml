
name: Build The Lost World 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check environment
        run: |
          node --version
          npm --version
          java -version

      - name: Find project folder
        run: |
          echo "Repository contents:"
          ls -la

          PACKAGE_FILE=$(find . -maxdepth 6 \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found!"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "Project folder: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check project files
        run: |
          cd "$PROJECT_DIR"

          missing=0

          for file in package.json capacitor.config.json www/index.html assets/icon.png; do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              missing=1
            fi
          done

          echo ""
          echo "Project folder contents:"
          ls -la

          echo ""
          echo "Assets folder:"
          ls -la assets 2>/dev/null || true

          echo ""
          echo "WWW folder:"
          ls -la www 2>/dev/null || true

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: Some required files are missing."
            exit 1
          fi

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Add Android platform
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Generate Android icons
        run: |
          cd "$PROJECT_DIR"
          npx capacitor-assets generate --android

      - name: Set landscape orientation
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android:screenOrientation=' not in s:
              s = s.replace(
                  "<activity",
                  '<activity android:screenOrientation="landscape"',
                  1
              )

          p.write_text(s)
          print("Landscape orientation enabled!")
          PY

      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Lost-World-2-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
